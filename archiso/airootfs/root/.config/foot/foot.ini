initial-window-size-pixels=1240x720
pad=18x14
title=Flynn OS — Terminal

[colors]
alpha=0.95
background=02060c
foreground=dff6ff

# Normal palette — graphite / ice
regular0=0a1a24
regular1=ff5545
regular2=43f5b0
regular3=ff9d29
regular4=2a7d9c
regular5=a98fd6
regular6=38e8ff
regular7=8fb2c2

# Bright palette
bright0=12303a
bright1=ff8a7f
bright2=7ff5c8
bright3=ffb85c
bright4=6fb6d6
bright5=c3aee6
bright6=7ff0ff
bright7=eafcff

selection-background=0e2b38
selection-foreground=eafcff
urls=38e8ff

[cursor]
